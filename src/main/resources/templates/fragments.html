<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="nav" class="navbar">
    <div class="navbar-inner">
        <a href="/dashboard" class="brand">📚 CollegeLib</a>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/books">Books</a>
            <a href="/transactions" sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">Transactions</a>
            <a href="/transactions/my" sec:authorize="hasRole('STUDENT')">My Transactions</a>
            <a href="/reports" sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">Reports</a>
            <a href="/admin/users" sec:authorize="hasRole('ADMIN')">Users</a>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <span class="user-chip" sec:authentication="name"></span>
            <button type="submit" class="btn-link">Logout</button>
        </form>
    </div>
</div>
</body>
</html>
