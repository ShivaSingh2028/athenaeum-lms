<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - CollegeLib</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>

<div class="container">
    <div class="page-title" th:text="'Welcome, ' + ${user.name}"></div>
    <div class="page-subtitle">Here's what's happening in the library today.</div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="num" th:text="${totalBooks}"></div>
            <div class="label">Book Titles</div>
        </div>
        <div class="stat-box">
            <div class="num" th:text="${totalCopies}"></div>
            <div class="label">Total Copies</div>
        </div>
        <div class="stat-box">
            <div class="num" th:text="${totalUsers}"></div>
            <div class="label">Registered Users</div>
        </div>
        <div class="stat-box">
            <div class="num" th:text="${issuedCount}"></div>
            <div class="label">Currently Issued</div>
        </div>
        <div class="stat-box warn">
            <div class="num" th:text="${overdueCount}"></div>
            <div class="label">Overdue</div>
        </div>
    </div>

    <div class="card">
        <div class="flex-between">
            <h3 style="margin:0; color:var(--navy);">Pending Reservations</h3>
            <a href="/reports" class="btn btn-outline btn-sm">View Full Reports →</a>
        </div>
        <table style="margin-top:14px;">
            <thead>
            <tr><th>Book</th><th>Reserved By</th><th>Since</th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${pendingReservations}">
                <td th:text="${r.book.title}"></td>
                <td th:text="${r.user.name}"></td>
                <td th:text="${r.reservationDate}"></td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(pendingReservations)}">No pending reservations right now.</div>
    </div>

    <div class="card">
        <h3 style="margin-top:0; color:var(--navy);">Recent Notifications</h3>
        <div th:each="n : ${notifications}" class="notif-item">
            <div th:text="${n.message}"></div>
            <div class="notif-time" th:text="${#temporals.format(n.createdAt, 'dd MMM, HH:mm')}"></div>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(notifications)}">No notifications yet.</div>
    </div>
</div>
</body>
</html>
