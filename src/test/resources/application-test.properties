# ==============================================================================
# Test Profile Configuration (SPRING_PROFILES_ACTIVE=test)
# ==============================================================================

spring.application.name=library-management-system-test

# Fallback in-memory database for local runs (overridden by Testcontainers in CI)
spring.datasource.url=jdbc:h2:mem:test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway disabled for H2 fallback; enabled by Testcontainers integration tests
spring.flyway.enabled=false

# Cache
spring.cache.type=caffeine
spring.cache.cache-names=tenantSettings,policies,catalogFacets

# Mail Mock
app.mail.from=test@athenaeum.edu
spring.mail.host=localhost
spring.mail.port=1025

# Payment Mock
app.razorpay.key-id=rzp_test_mock_id
app.razorpay.key-secret=rzp_test_mock_secret
app.razorpay.webhook-secret=test_webhook_secret_12345
