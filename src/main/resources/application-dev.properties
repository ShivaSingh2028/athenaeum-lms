# ==============================================================================
# Local Development & Instant Browser Preview Profile
# (No external PostgreSQL or Docker installation required)
# ==============================================================================

spring.application.name=library-management-system-dev
server.port=8080

# In-Memory Database with PostgreSQL dialect compatibility
spring.datasource.url=jdbc:h2:mem:library_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create schema on startup for instant zero-config dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for in-memory embedded H2
spring.flyway.enabled=false

# Cache
spring.cache.type=caffeine
spring.cache.cache-names=tenantSettings,policies,catalogFacets

# Security / Session
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=60m

# Thymeleaf
spring.thymeleaf.cache=false

# Mock credentials
app.razorpay.key-id=rzp_dev_mock_key
app.razorpay.key-secret=rzp_dev_mock_secret
app.razorpay.webhook-secret=dev_webhook_secret_mock
