<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Form - CollegeLib</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>

<div class="container" style="max-width:600px;">
    <div class="page-title" th:text="${book.id == null ? 'Add New Book' : 'Edit Book'}"></div>

    <div class="card">
        <form th:action="${book.id == null ? '/books' : '/books/' + book.id}" method="post" th:object="${book}">
            <div class="form-group">
                <label>Title</label>
                <input type="text" th:field="*{title}" required>
            </div>
            <div class="form-group">
                <label>Author</label>
                <input type="text" th:field="*{author}" required>
            </div>
            <div class="form-group">
                <label>ISBN</label>
                <input type="text" th:field="*{isbn}" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" th:field="*{category}" placeholder="e.g. Computer Science">
            </div>
            <div class="form-group">
                <label>Publisher</label>
                <input type="text" th:field="*{publisher}">
            </div>
            <div class="form-group">
                <label>Total Copies</label>
                <input type="number" th:field="*{totalCopies}" min="1" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Book</button>
            <a href="/books" class="btn btn-outline">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
