# ===============================
# Application
# ===============================
spring.application.name=library-management-system
server.port=8080

# ===============================
# Database - MySQL (using the library_db schema you created in Workbench)
# Update username/password to match your MySQL Workbench login.
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=password

# ===============================
# JPA / Hibernate
# ddl-auto=update -> Hibernate creates/updates tables automatically from your entities
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Library business rules
# ===============================
library.loan.period-days=14
library.fine.per-day=5
library.reservation.hold-days=2

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.cache=false
