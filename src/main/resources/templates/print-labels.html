<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Labels - ' + ${book.title}">Print Labels</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #fff; }
        .no-print { margin-bottom: 20px; padding: 12px; background: #f6f3ec; border: 1px solid #e0dbcd; border-radius: 6px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        .label-card {
            border: 2px dashed #b98d2e;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            background: #fff;
            page-break-inside: avoid;
        }
        .library-name { font-size: 0.75rem; font-weight: 700; color: #1b2a4a; text-transform: uppercase; margin-bottom: 4px; }
        .book-title { font-size: 0.85rem; font-weight: 700; color: #1f242e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .shelf { font-size: 0.75rem; color: #7a1f2b; font-weight: 600; margin-bottom: 8px; }
        .barcode-img { max-width: 100%; height: 50px; display: block; margin: 0 auto 4px auto; }
        .barcode-num { font-family: monospace; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; color: #1b2a4a; }
        @media print {
            .no-print { display: none; }
            body { padding: 0; }
            .label-card { border: 1px solid #bbb; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <button onclick="window.print()" style="padding: 8px 18px; font-weight: 700; background: #1b2a4a; color: #fff; border: none; border-radius: 4px; cursor: pointer;">
        🖨️ Print Labels Sheet
    </button>
    <button onclick="window.close()" style="padding: 8px 18px; background: #eee; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; margin-left: 10px;">
        Close
    </button>
    <span style="margin-left: 16px; color: #6b6558; font-size: 0.9rem;">
        Ready for standard adhesive label printing.
    </span>
</div>

<div class="grid">
    <div class="label-card" th:each="c : ${copies}">
        <div class="library-name" th:text="${settings.libraryName}">Athenaeum Library</div>
        <div class="book-title" th:text="${book.title}">Book Title</div>
        <div class="shelf" th:text="'Loc: ' + ${c.shelfLocation}">Rack A1</div>
        <img class="barcode-img" th:src="@{/barcode/{code}(code=${c.barcode})}" alt="Barcode">
        <div class="barcode-num" th:text="${c.barcode}">BC-1001-001</div>
    </div>
</div>

</body>
</html>
