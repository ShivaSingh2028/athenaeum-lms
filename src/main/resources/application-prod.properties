# ==============================================================================
# Production Configuration Profile (SPRING_PROFILES_ACTIVE=prod)
# Hardened for Cloud Deployments (Docker, Kubernetes, Render, Railway, AWS ECS)
# ==============================================================================

# Database via component variables (Render / Supabase / AWS / Docker)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Explicit Flyway connection to match
spring.flyway.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=require
spring.flyway.user=${PGUSER}
spring.flyway.password=${PGPASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Production Security
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Thymeleaf caching enabled in prod
spring.thymeleaf.cache=true

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=tenantSettings,policies,catalogFacets

# Actuator access restricted
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
