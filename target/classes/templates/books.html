<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Books - CollegeLib</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>

<div class="container">
    <div class="flex-between">
        <div>
            <div class="page-title">Book Catalog</div>
            <div class="page-subtitle">Search and manage the library's collection.</div>
        </div>
        <a href="/books/new" class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">+ Add Book</a>
    </div>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form class="search-bar" method="get" th:action="@{/books}">
        <input type="text" name="q" placeholder="Search by title, author, or ISBN..." th:value="${query}">
        <button class="btn btn-secondary" type="submit">Search</button>
    </form>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Title</th><th>Author</th><th>Category</th><th>Available</th><th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${books}">
                <td th:text="${b.title}"></td>
                <td th:text="${b.author}"></td>
                <td th:text="${b.category}"></td>
                <td th:text="${b.availableCopies + ' / ' + b.totalCopies}"></td>
                <td>
                    <span sec:authorize="hasRole('STUDENT')">
                        <form th:if="${b.availableCopies > 0}" th:action="@{'/transactions/issue/' + ${b.id}}" method="post" style="display:inline;">
                            <button class="btn btn-primary btn-sm" type="submit">Issue</button>
                        </form>
                        <form th:if="${b.availableCopies == 0}" th:action="@{'/reservations/reserve/' + ${b.id}}" method="post" style="display:inline;">
                            <button class="btn btn-outline btn-sm" type="submit">Reserve</button>
                        </form>
                    </span>
                    <span sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
                        <a th:href="@{'/books/' + ${b.id} + '/edit'}" class="btn btn-outline btn-sm">Edit</a>
                        <form th:action="@{'/books/' + ${b.id} + '/delete'}" method="post" style="display:inline;"
                              onsubmit="return confirm('Delete this book?');">
                            <button class="btn btn-outline btn-sm" type="submit">Delete</button>
                        </form>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(books)}">No books match your search.</div>
    </div>
</div>
</body>
</html>
