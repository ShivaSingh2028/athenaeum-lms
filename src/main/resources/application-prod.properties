# ==============================================================================
# Production Configuration Profile (SPRING_PROFILES_ACTIVE=prod)
# Hardened for Cloud Deployments (Docker, Kubernetes, Render, Railway, AWS ECS)
# ==============================================================================

# Database via DATABASE_URL or component variables
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:library_saas}?sslmode=require}}
spring.datasource.username=${PGUSER:${DB_USERNAME:lms_user}}
spring.datasource.password=${PGPASSWORD:${DB_PASSWORD:lms_secret}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Production Security
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Thymeleaf caching enabled in prod
spring.thymeleaf.cache=true

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=tenantSettings,policies,catalogFacets

# Actuator access restricted
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
