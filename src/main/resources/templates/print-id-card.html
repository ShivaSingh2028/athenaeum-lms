<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Library Pass - ' + ${user.name}">Member Card</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 24px; background: #f6f3ec; }
        .no-print { margin-bottom: 24px; padding: 12px; background: #fff; border: 1px solid #e0dbcd; border-radius: 6px; }
        .card-container { display: flex; justify-content: center; }
        .id-card {
            width: 360px;
            height: 220px;
            background: linear-gradient(135deg, #1b2a4a 0%, #0e1726 100%);
            border: 2px solid #b98d2e;
            border-radius: 14px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(185,141,46,0.4); padding-bottom: 8px; }
        .inst-name { font-size: 0.85rem; font-weight: 800; color: #d4a849; letter-spacing: 0.5px; }
        .badge-type { font-size: 0.7rem; font-weight: 700; background: #7a1f2b; padding: 2px 8px; border-radius: 10px; }
        .body-row { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
        .avatar-placeholder {
            width: 54px; height: 54px; border-radius: 8px; border: 2px solid #b98d2e;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: rgba(255,255,255,0.1);
        }
        .member-info { flex: 1; }
        .member-name { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .member-code { font-family: monospace; font-size: 0.8rem; color: #d4a849; }
        .member-email { font-size: 0.75rem; color: #cbd5e1; }
        .footer-row { display: flex; align-items: flex-end; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }
        .barcode-strip { height: 38px; }
        @media print {
            .no-print { display: none; }
            body { background: #fff; padding: 0; }
            .id-card { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="no-print" style="max-width: 500px; margin: 0 auto 20px auto;">
    <button onclick="window.print()" style="padding: 8px 18px; font-weight: 700; background: #1b2a4a; color: #fff; border: none; border-radius: 4px; cursor: pointer;">
        🖨️ Print Library Pass
    </button>
    <button onclick="window.close()" style="padding: 8px 18px; background: #eee; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; margin-left: 10px;">
        Close
    </button>
</div>

<div class="card-container">
    <div class="id-card">
        <div class="header">
            <div class="inst-name" th:text="${settings.libraryName}">ATHENAEUM LIBRARY</div>
            <div class="badge-type" th:text="${user.role}">MEMBER</div>
        </div>
        <div class="body-row">
            <div class="avatar-placeholder">👤</div>
            <div class="member-info">
                <div class="member-name" th:text="${user.name}">Patron Name</div>
                <div class="member-code" th:text="'ID: ' + (${user.memberCode != null ? user.memberCode : 'LIB-' + user.id})">LIB-1001</div>
                <div class="member-email" th:text="${user.email}">patron@college.edu</div>
            </div>
            <div>
                <img th:src="@{/barcode/qr/{code}(code=${user.email})}" alt="QR" width="56" height="56" style="border-radius: 4px; background: #fff; padding: 2px;">
            </div>
        </div>
        <div class="footer-row">
            <div>
                <img class="barcode-strip" th:src="@{/barcode/{code}(code=${user.memberCode != null ? user.memberCode : 'LIB-' + user.id})}" alt="Barcode">
            </div>
            <div style="font-size: 0.65rem; color: #94a3b8; text-align: right;">
                Official Digital Pass<br>Scan at Circulation Desk
            </div>
        </div>
    </div>
</div>

</body>
</html>
