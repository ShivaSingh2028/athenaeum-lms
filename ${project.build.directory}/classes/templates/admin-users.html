<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users - CollegeLib</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>

<div class="container">
    <div class="page-title">Manage Users</div>
    <div class="page-subtitle">Assign roles and enable/disable accounts.</div>

    <div class="card">
        <h3 style="margin-top:0; color:var(--navy);">Add Staff Account</h3>
        <form th:action="@{/admin/users/add}" method="post" style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
            <div class="form-group" style="margin-bottom:0; flex:1; min-width:150px;">
                <label>Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group" style="margin-bottom:0; flex:1; min-width:180px;">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group" style="margin-bottom:0; flex:1; min-width:140px;">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group" style="margin-bottom:0; min-width:130px;">
                <label>Role</label>
                <select name="role">
                    <option value="LIBRARIAN">Librarian</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Add</button>
        </form>
    </div>

    <div class="card">
        <table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.name}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.role}"></td>
                <td th:text="${u.enabled ? 'Active' : 'Disabled'}"></td>
                <td>
                    <form th:action="@{'/admin/users/' + ${u.id} + '/role'}" method="post" style="display:inline;">
                        <select name="role" onchange="this.form.submit()">
                            <option value="STUDENT" th:selected="${u.role.name() == 'STUDENT'}">Student</option>
                            <option value="LIBRARIAN" th:selected="${u.role.name() == 'LIBRARIAN'}">Librarian</option>
                            <option value="ADMIN" th:selected="${u.role.name() == 'ADMIN'}">Admin</option>
                        </select>
                    </form>
                    <form th:action="@{'/admin/users/' + ${u.id} + '/toggle'}" method="post" style="display:inline;">
                        <button class="btn btn-outline btn-sm" type="submit" th:text="${u.enabled ? 'Disable' : 'Enable'}"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
