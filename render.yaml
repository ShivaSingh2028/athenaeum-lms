services:
  - type: web
    name: athenaeum-lms
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: athenaeum-db
          property: connectionString
      - key: APP_BOOTSTRAP_INITIAL_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: athenaeum-db
    plan: free
    region: oregon
    databaseName: library_saas
    user: lms_user
