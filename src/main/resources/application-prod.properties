# ===============================
# PRODUCTION PROFILE ? used only on Render (or any host) when
# SPRING_PROFILES_ACTIVE=prod is set as an environment variable.
# Your local run (no active profile) still uses MySQL from application.properties.
# ===============================

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}