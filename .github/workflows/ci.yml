name: CI - Build, Test & Security Verification

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Maven Clean-Room Test Suite (with Testcontainers PostgreSQL)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Verify Docker Daemon
        run: |
          docker --version
          docker info

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: "Step 1: Flyway Clean Schema Migration & DDL Validation (Testcontainers PostgreSQL)"
        id: flyway-validation
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=PostgreSqlFlywayValidationTest
        env:
          SPRING_PROFILES_ACTIVE: test
          CI: true

      - name: "Step 2: Run Full Test Suite (Unit, Real DB Rules, Route Security, Concurrency, JaCoCo)"
        id: full-test-suite
        run: ./mvnw --batch-mode --no-transfer-progress verify -Dtest="!PostgreSqlFlywayValidationTest"
        env:
          SPRING_PROFILES_ACTIVE: test
          CI: true

      - name: Print Test Failures on Error
        if: failure()
        run: |
          echo "========================================================================"
          echo "                      SUREFIRE FAILURE REPORT DUMP                      "
          echo "========================================================================"
          for f in target/surefire-reports/*.txt; do
            if [ -f "$f" ]; then
              echo "--- File: $f ---"
              cat "$f"
              echo ""
            fi
          done

      - name: Upload JaCoCo Code Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Surefire Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright Screenshots & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
            e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 14
